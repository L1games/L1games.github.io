<!DOCTYPE html>
<html lang="es" class="h-full w-full">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Player</title>
	<link rel="favicon" src="./player/favicon.png"></link>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./player/jszip.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            accent: '#10b981',
                            glow: 'rgba(16, 185, 129, 0.25)',
                        },
                        dark: {
                            base: '#0b0f17',
                            surface: '#121824',
                            border: '#1f293d',
                            hover: '#26334d'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for playlist */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(18, 24, 36, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
        
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.3);
        }

        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .custom-range::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
    </style>
  </head>
  <body class="bg-dark-base text-gray-100 h-full w-full flex flex-col overflow-hidden font-sans select-none">
    <header class="h-12 bg-dark-surface border-b border-dark-border flex items-center justify-between px-4 z-10 shrink-0">
        <div class="flex items-center gap-2">
            <button id="btn-back" onclick="goBack()" class="p-1.5 rounded-lg bg-dark-base hover:bg-dark-hover text-gray-300 hover:text-brand-accent transition border border-dark-border" title="Atrás (Historial Iframe)">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <button id="btn-forward" onclick="goForward()" class="p-1.5 rounded-lg bg-dark-base hover:bg-dark-hover text-gray-300 hover:text-brand-accent transition border border-dark-border" title="Adelante (Historial Iframe)">
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            <button onclick="reloadFrame()" class="p-1.5 rounded-lg bg-dark-base hover:bg-dark-hover text-gray-300 hover:text-brand-accent transition border border-dark-border ml-1" title="Recargar Iframe">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>
            <div class="ml-3 hidden sm:flex items-center gap-2 bg-dark-base px-3 py-1 rounded-full border border-dark-border text-xs text-gray-400">
                <i data-lucide="globe" class="w-3.5 h-3.5 text-brand-accent"></i>
                <span id="url-display" class="truncate max-w-xs md:max-w-md">Page</span>
            </div>
        </div>

        <div class="flex items-center gap-2 text-xs text-gray-400">
            <span class="hidden md:inline-block">Local Music</span>
            <span class="inline-block w-2 h-2 rounded-full bg-brand-accent animate-pulse"></span>
        </div>
    </header>

    <main class="flex-1 w-full h-full relative bg-dark-base">
        <iframe 
            id="content-frame" 
            src="./index.html" 
            class="w-full h-full border-none"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            title="Sitio Principal">
        </iframe>

        <div id="iframe-fallback" class="hidden absolute inset-0 bg-dark-base flex flex-col items-center justify-center p-6 text-center z-0">
            <i data-lucide="shield-alert" class="w-12 h-12 text-yellow-500 mb-3"></i>
            <h3 class="text-lg font-bold text-white mb-1">Restricción de visualización</h3>
            <p class="text-sm text-gray-400 max-w-md mb-4">
                Error.
            </p>
            <button onclick="reloadFrame()" class="px-4 py-2 bg-brand-accent text-dark-base font-semibold text-xs rounded-lg hover:bg-emerald-400 transition">
                Reintentar
            </button>
        </div>
    </main>

    <div id="floating-player-wrapper" class="fixed bottom-4 right-4 z-50 flex flex-col items-end transition-all duration-300 max-w-[calc(100vw-2rem)]">
      <div id="playlist-drawer" class="hidden w-80 md:w-96 bg-dark-surface/95 backdrop-blur-md border border-dark-border rounded-2xl mb-3 shadow-2xl overflow-hidden transition-all duration-300 glow-effect">
          <div class="p-3 border-b border-dark-border flex items-center justify-between bg-dark-base/50">
              <div class="flex items-center gap-2">
                  <i data-lucide="list-music" class="w-4 h-4 text-brand-accent"></i>
                  <span class="text-xs font-semibold uppercase tracking-wider text-gray-300">Lista de Reproducción</span>
                  <span id="song-count-badge" class="text-[10px] bg-dark-border text-gray-400 px-1.5 py-0.5 rounded-full">0</span>
              </div>
              <button onclick="togglePlaylist()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-dark-hover transition">
                  <i data-lucide="x" class="w-4 h-4"></i>
              </button>
          </div>

            <ul id="playlist-items" class="max-h-60 overflow-y-auto divide-y divide-dark-border/40 text-xs">
                <li id="empty-playlist-msg" class="p-6 text-center text-gray-500 flex flex-col items-center gap-2">
                    <i data-lucide="folder-archive" class="w-8 h-8 stroke-1 text-gray-600"></i>
                    <span>Carga un archivo <b>.ZIP</b> con canciones MP3 para comenzar</span>
                </li>
            </ul>
        </div>

        <div class="bg-dark-surface/90 backdrop-blur-md border border-dark-border rounded-2xl p-3 md:p-4 shadow-2xl flex flex-col gap-2 min-w-[300px] sm:min-w-[360px] md:min-w-[420px] glow-effect">
            
            <input type="file" id="zip-file-input" accept=".zip" class="hidden" onchange="handleZipUpload(event)">

            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-xl bg-dark-base border border-dark-border flex items-center justify-center shrink-0 relative overflow-hidden group">
                        <i id="music-disc-icon" data-lucide="disc" class="w-5 h-5 text-brand-accent transition-transform duration-1000"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h4 id="track-title" class="text-xs font-semibold text-white truncate max-w-[180px] sm:max-w-[220px]">Ninguna canción seleccionada</h4>
                        <p id="track-status" class="text-[11px] text-gray-400 truncate">Selecciona un archivo .zip</p>
                    </div>
                </div>

                <button onclick="document.getElementById('zip-file-input').click()" class="flex items-center gap-1.5 px-3 py-1.5 bg-brand-accent/10 hover:bg-brand-accent/20 border border-brand-accent/30 text-brand-accent text-xs font-medium rounded-xl transition shrink-0" title="Cargar ZIP con MP3s">
                    <i data-lucide="file-archive" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Cargar ZIP</span>
                </button>
            </div>

            <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono mt-1">
                <span id="time-current">0:00</span>
                <input type="range" id="seek-slider" min="0" max="100" value="0" class="custom-range w-full h-1 bg-dark-border rounded-lg appearance-none cursor-pointer accent-brand-accent" oninput="seekTrack(this.value)">
                <span id="time-total">0:00</span>
            </div>

            <div class="flex items-center justify-between pt-1">
                
                <div class="flex items-center gap-1">
                    <button id="btn-random" onclick="toggleRandomMode()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-dark-hover transition" title="Modo Aleatorio (Random)">
                        <i data-lucide="shuffle" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-playlist-toggle" onclick="togglePlaylist()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-dark-hover transition relative" title="Ver Lista de Reproducción">
                        <i data-lucide="music" class="w-4 h-4"></i>
                        <span id="playlist-indicator" class="hidden absolute top-1 right-1 w-1.5 h-1.5 bg-brand-accent rounded-full"></span>
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="playPrev()" class="p-2 text-gray-300 hover:text-white hover:bg-dark-hover rounded-full transition" title="Anterior">
                        <i data-lucide="skip-back" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-play" onclick="togglePlayPause()" class="p-2.5 bg-brand-accent text-dark-base rounded-full hover:scale-105 transition shadow-lg shadow-brand-glow" title="Reproducir / Pausa">
                        <i id="play-icon" data-lucide="play" class="w-5 h-5 fill-current"></i>
                    </button>
                    <button onclick="playNext()" class="p-2 text-gray-300 hover:text-white hover:bg-dark-hover rounded-full transition" title="Siguiente">
                        <i data-lucide="skip-forward" class="w-4 h-4"></i>
                    </button>
                </div>
              
                <div class="flex items-center gap-1 group relative">
                    <button id="btn-mute" onclick="toggleMute()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-dark-hover transition" title="Silenciar">
                        <i id="volume-icon" data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="custom-range w-16 h-1 bg-dark-border rounded-lg appearance-none cursor-pointer accent-brand-accent" oninput="changeVolume(this.value)">
                </div>

            </div>

        </div>
    </div>

    <audio id="native-audio-player" class="hidden"></audio>
	
    <script>
       
        let playlist = []; 
        let currentIndex = -1;
        let isRandom = false;
        let isMuted = false;
        let lastVolume = 0.8;
        let currentBlobUrl = null;

       
        const contentFrame = document.getElementById('content-frame');
        const audio = document.getElementById('native-audio-player');
        const playBtnIcon = document.getElementById('play-icon');
        const trackTitle = document.getElementById('track-title');
        const trackStatus = document.getElementById('track-status');
        const seekSlider = document.getElementById('seek-slider');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const playlistDrawer = document.getElementById('playlist-drawer');
        const playlistItems = document.getElementById('playlist-items');
        const emptyPlaylistMsg = document.getElementById('empty-playlist-msg');
        const songCountBadge = document.getElementById('song-count-badge');
        const musicDiscIcon = document.getElementById('music-disc-icon');
        const btnRandom = document.getElementById('btn-random');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');

    
        lucide.createIcons();

        function goBack() {
            try {
                contentFrame.contentWindow.history.back();
            } catch (e) {
                console.warn('Cannot navigate history directly due to cross-origin policies.', e);
            }
        }

        function goForward() {
            try {
                contentFrame.contentWindow.history.forward();
            } catch (e) {
                console.warn('Cannot navigate history directly due to cross-origin policies.', e);
            }
        }

        function reloadFrame() {
            contentFrame.src = contentFrame.src;
        }

        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.key === 'ArrowLeft' && e.altKey) {
                goBack();
            } else if (e.key === 'ArrowRight' && e.altKey) {
                goForward();
            }
        });

        async function handleZipUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            trackTitle.innerText = "Extrayendo archivo ZIP...";
            trackStatus.innerText = "Procesando...";

            try {
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                
                playlist = [];
                playlistItems.innerHTML = "";

                const filenames = Object.keys(contents.files);
                for (let filename of filenames) {
                    const zipEntry = contents.files[filename];
                    if (!zipEntry.dir && filename.toLowerCase().endsWith('.mp3')) {
                        const cleanName = filename.split('/').pop().replace(/\.mp3$/i, '');
                        playlist.push({
                            fullName: filename,
                            cleanName: cleanName,
                            entry: zipEntry
                        });
                    }
                }

                if (playlist.length === 0) {
                    trackTitle.innerText = "Sin MP3s encontrados";
                    trackStatus.innerText = "El ZIP no contiene canciones .mp3";
                    songCountBadge.innerText = "0";
                    playlistItems.appendChild(emptyPlaylistMsg);
                    return;
                }

                songCountBadge.innerText = playlist.length;
                renderPlaylistUI();

                currentIndex = 0;
                await playTrack(currentIndex);
                
                playlistDrawer.classList.remove('hidden');

            } catch (error) {
                console.error("Error unzipping file:", error);
                trackTitle.innerText = "Error de lectura";
                trackStatus.innerText = "No se pudo descomprimir el archivo";
            }
        }

        function renderPlaylistUI() {
            playlistItems.innerHTML = "";
            
            playlist.forEach((song, idx) => {
                const li = document.createElement('li');
                li.id = `playlist-item-${idx}`;
                li.className = `p-2.5 px-3 hover:bg-dark-hover cursor-pointer transition flex items-center justify-between gap-2 ${idx === currentIndex ? 'bg-brand-accent/10 text-brand-accent font-medium' : 'text-gray-300'}`;
                li.onclick = () => playTrack(idx);

                li.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i data-lucide="${idx === currentIndex ? 'disc' : 'music'}" class="w-3.5 h-3.5 shrink-0 ${idx === currentIndex ? 'animate-spin text-brand-accent' : 'text-gray-500'}"></i>
                        <span class="truncate">${song.cleanName}</span>
                    </div>
                    <span class="text-[10px] text-gray-500 font-mono">MP3</span>
                `;
                playlistItems.appendChild(li);
            });
            lucide.createIcons();
        }

        async function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;

            currentIndex = index;
            const track = playlist[currentIndex];

            trackTitle.innerText = track.cleanName;
            trackStatus.innerText = "Descomprimiendo pistas...";

            try {
                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                }

                const blob = await track.entry.async('blob');
                currentBlobUrl = URL.createObjectURL(new Blob([blob], { type: 'audio/mp3' }));

                audio.src = currentBlobUrl;
                audio.volume = volumeSlider.value;

                await audio.play();
                
                trackStatus.innerText = "Reproduciendo";
                updatePlayStateUI(true);
                renderPlaylistUI();

            } catch (err) {
                console.error("Error playing track:", err);
                trackStatus.innerText = "Error de reproducción";
                updatePlayStateUI(false);
            }
        }

        function togglePlayPause() {
            if (playlist.length === 0) {
                document.getElementById('zip-file-input').click();
                return;
            }

            if (audio.paused) {
                audio.play();
                updatePlayStateUI(true);
            } else {
                audio.pause();
                updatePlayStateUI(false);
            }
        }

        function playNext() {
            if (playlist.length === 0) return;

            if (isRandom) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                playTrack(randomIndex);
            } else {
                const nextIndex = (currentIndex + 1) % playlist.length;
                playTrack(nextIndex);
            }
        }

        function playPrev() {
            if (playlist.length === 0) return;
            const prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(prevIndex);
        }

        function toggleRandomMode() {
            isRandom = !isRandom;
            if (isRandom) {
                btnRandom.classList.add('text-brand-accent', 'bg-brand-accent/10');
                btnRandom.classList.remove('text-gray-400');
            } else {
                btnRandom.classList.remove('text-brand-accent', 'bg-brand-accent/10');
                btnRandom.classList.add('text-gray-400');
            }
        }

        function togglePlaylist() {
            playlistDrawer.classList.toggle('hidden');
        }

        function updatePlayStateUI(isPlaying) {
            if (isPlaying) {
                playBtnIcon.setAttribute('data-lucide', 'pause');
                musicDiscIcon.classList.add('animate-spin');
            } else {
                playBtnIcon.setAttribute('data-lucide', 'play');
                musicDiscIcon.classList.remove('animate-spin');
            }
            lucide.createIcons();
        }

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = progress;
                timeCurrent.innerText = formatTime(audio.currentTime);
                timeTotal.innerText = formatTime(audio.duration);
            }
        });
		
        audio.addEventListener('ended', () => {
            playNext();
        });

        function seekTrack(value) {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (value / 100) * audio.duration;
            }
        }

        function changeVolume(val) {
            audio.volume = val;
            isMuted = val == 0;
            updateVolumeIcon(val);
        }

        function toggleMute() {
            if (isMuted) {
                audio.volume = lastVolume;
                volumeSlider.value = lastVolume;
                isMuted = false;
            } else {
                lastVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                isMuted = true;
            }
            updateVolumeIcon(audio.volume);
        }

        function updateVolumeIcon(val) {
            if (val == 0) {
                volumeIcon.setAttribute('data-lucide', 'volume-x');
            } else if (val < 0.5) {
                volumeIcon.setAttribute('data-lucide', 'volume-1');
            } else {
                volumeIcon.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
  </body>
</html>
